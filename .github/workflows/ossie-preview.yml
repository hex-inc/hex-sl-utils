name: Ossie preview artifacts

on:
  pull_request:
    paths:
      - "packages/ossie-hex/**"
      - "scripts/ossie-hex/**"
      - ".github/workflows/ossie-preview.yml"
  push:
    branches: [main]
    paths:
      - "packages/ossie-hex/**"
      - "scripts/ossie-hex/**"
      - ".github/workflows/ossie-preview.yml"
  workflow_dispatch:
    inputs:
      release_id:
        description: "Preview identifier (index path: ossie-preview/<identifier>)"
        required: true
        type: string
      publish:
        description: "Publish the tested assets to Hex's Python package index (main only)"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ossie-preview-${{ inputs.release_id || github.run_id }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.5"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.build.outputs.release_id }}
    steps:
      - name: Check out the source to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require main for publishing
        env:
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          if [[ "$PUBLISH" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Publish preview releases from main"
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: scripts/ossie-hex/requirements.lock
      - name: Build the two wheels and release metadata
        id: build
        env:
          PREVIEW_ID: ${{ inputs.release_id || format('candidate-{0}', github.sha) }}
        run: |
          uv run --no-project --python 3.14 python scripts/ossie-hex/preview.py \
            build "$PREVIEW_ID" --out-dir dist/ossie-preview
          printf 'release_id=%s\n' "$PREVIEW_ID" >> "$GITHUB_OUTPUT"
      - name: Save the exact assets for testing and publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ossie-preview
          path: dist/ossie-preview/
          if-no-files-found: error

  test:
    name: Install and convert (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - name: Check out the tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ossie-preview
          path: dist/ossie-preview/
      - name: Install the test runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - name: Verify assets and install into private Python 3.12
        env:
          OSSIE_PREVIEW_ASSETS: ${{ github.workspace }}/dist/ossie-preview
        run: >-
          uv run --no-project --python 3.14
          --with pytest==9.1.1 --with PyYAML==6.0.3
          python -m pytest scripts/ossie-hex/test_preview.py -q

  publish:
    name: Publish to Hex's Python package index
    needs: [build, test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'hex-inc/hex-sl-utils'
    runs-on: ubuntu-latest
    environment: ossie-preview
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the tested release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ossie-preview
          path: assets/
      - name: Require index publishing configuration
        env:
          AWS_ROLE: ${{ vars.PYPI_INDEX_AWS_IAM_ROLE_ARN }}
          BUCKET: ${{ vars.PYPI_INDEX_AWS_S3_BUCKET_NAME }}
          KMS_KEY: ${{ vars.PYPI_INDEX_AWS_KMS_KEY_ARN }}
          DISTRIBUTION: ${{ vars.PYPI_INDEX_AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          for value in "$AWS_ROLE" "$BUCKET" "$KMS_KEY" "$DISTRIBUTION"; do
            if [[ -z "$value" ]]; then
              echo "::error::Configure the ossie-preview environment's index publishing variables"
              exit 1
            fi
          done
      - name: Assume the index publishing role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.PYPI_INDEX_AWS_IAM_ROLE_ARN }}
          aws-region: us-east-2
      - name: Upload immutable preview assets and invalidate CloudFront
        env:
          PREVIEW_ID: ${{ needs.build.outputs.release_id }}
          BUCKET: ${{ vars.PYPI_INDEX_AWS_S3_BUCKET_NAME }}
          KMS_KEY: ${{ vars.PYPI_INDEX_AWS_KMS_KEY_ARN }}
          DISTRIBUTION: ${{ vars.PYPI_INDEX_AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          python3 scripts/ossie-hex/publish.py "$PREVIEW_ID" --assets assets \
            --bucket "$BUCKET" --kms-key "$KMS_KEY" \
            --distribution-id "$DISTRIBUTION" --execute
