name: Ossie preview artifacts

on:
  pull_request:
    paths:
      - "external/apache-ossie-converters"
      - ".gitmodules"
      - "scripts/ossie-preview/**"
      - ".github/workflows/ossie-preview.yml"
  push:
    branches: [main]
    paths:
      - "external/apache-ossie-converters"
      - ".gitmodules"
      - "scripts/ossie-preview/**"
      - ".github/workflows/ossie-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ossie-preview-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  UV_VERSION: "0.12.5"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out the source to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Select a changed preview and allocate its version
        id: release
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'hex-inc/hex-sl-utils' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            python3 scripts/ossie-preview/plan_release.py --publish --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ossie-preview/plan_release.py --github-output "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        if: steps.release.outputs.release_id != ''
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: scripts/ossie-preview/bundle/uv.lock
      - name: Build the converter bundle and release metadata
        if: steps.release.outputs.release_id != ''
        env:
          PREVIEW_ID: ${{ steps.release.outputs.release_id }}
        run: |
          uv run --no-project --python 3.14 python scripts/ossie-preview/main.py \
            build "$PREVIEW_ID" --out-dir dist/ossie-preview --require-clean
      - name: Save the exact assets for testing and publishing
        if: steps.release.outputs.release_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ossie-preview
          path: dist/ossie-preview/
          if-no-files-found: error

  test:
    name: Install and convert (${{ matrix.os }})
    needs: build
    if: needs.build.outputs.release_id != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            macos-15-intel,
            windows-latest,
          ]
    steps:
      - name: Check out the tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ossie-preview
          path: dist/ossie-preview/
      - name: Install the test runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - name: Verify assets and install into private Python 3.12
        env:
          OSSIE_PREVIEW_ASSETS: ${{ github.workspace }}/dist/ossie-preview
        run: >-
          uv run --no-project --python 3.14
          --with pytest==9.1.1 --with PyYAML==6.0.3
          python -m pytest scripts/ossie-preview/test_installation.py -q

  publish:
    name: Publish GitHub preview release
    needs: [build, test]
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.repository == 'hex-inc/hex-sl-utils'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the tested release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ossie-preview
          path: assets/
      - name: Verify the payload
        run: python3 scripts/ossie-preview/main.py verify --assets assets
      - name: Upload to a draft release, then publish the complete preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_ID: ${{ needs.build.outputs.release_id }}
        run: |
          gh release create "ossie-preview/$PREVIEW_ID" \
            --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "Apache Ossie preview $PREVIEW_ID" \
            --notes-file assets/RELEASE_NOTES.md assets/*
          gh release edit "ossie-preview/$PREVIEW_ID" --draft=false --latest=false
