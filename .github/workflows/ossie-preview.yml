name: Ossie preview artifacts

on:
  pull_request:
    paths:
      - "packages/ossie-hex/**"
      - "scripts/ossie-hex/**"
      - ".github/workflows/ossie-preview.yml"
  push:
    branches: [main]
    paths:
      - "packages/ossie-hex/**"
      - "scripts/ossie-hex/**"
      - ".github/workflows/ossie-preview.yml"
  workflow_dispatch:
    inputs:
      release_id:
        description: "Preview identifier (tag: ossie-preview/<identifier>)"
        required: true
        type: string
      publish:
        description: "Publish the tested assets as a GitHub prerelease (main only)"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ossie-preview-${{ inputs.release_id || github.run_id }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.5"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.build.outputs.release_id }}
    steps:
      - name: Check out the source to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require main for publishing
        env:
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          if [[ "$PUBLISH" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Publish preview releases from main"
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: scripts/ossie-hex/requirements.lock
      - name: Build the two wheels and release metadata
        id: build
        env:
          PREVIEW_ID: ${{ inputs.release_id || format('candidate-{0}', github.sha) }}
        run: |
          uv run --no-project --python 3.14 python scripts/ossie-hex/preview.py \
            build "$PREVIEW_ID" --out-dir dist/ossie-preview
          printf 'release_id=%s\n' "$PREVIEW_ID" >> "$GITHUB_OUTPUT"
      - name: Save the exact assets for testing and publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ossie-preview
          path: dist/ossie-preview/
          if-no-files-found: error

  test:
    name: Install and convert (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - name: Check out the tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ossie-preview
          path: dist/ossie-preview/
      - name: Install the test runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - name: Verify assets and install into private Python 3.12
        env:
          OSSIE_PREVIEW_ASSETS: ${{ github.workspace }}/dist/ossie-preview
        run: >-
          uv run --no-project --python 3.14
          --with pytest==9.1.1 --with PyYAML==6.0.3
          python -m pytest scripts/ossie-hex/test_preview.py -q

  publish:
    name: Publish GitHub preview release
    needs: [build, test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'hex-inc/hex-sl-utils'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ossie-preview
          path: assets/
      - name: Verify the payload
        working-directory: assets
        run: sha256sum --check SHA256SUMS
      - name: Create a new GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_ID: ${{ needs.build.outputs.release_id }}
        run: |
          gh release create "ossie-preview/$PREVIEW_ID" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Hex Ossie preview $PREVIEW_ID" \
            --notes-file assets/RELEASE_NOTES.md assets/*
