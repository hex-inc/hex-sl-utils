name: Publish package

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.2"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main; then
            echo "::error::Release tag must point to a commit on main"
            exit 1
          fi
      - name: Install Devbox
        uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          devbox-version: 0.17.5
          enable-cache: "true"
      - name: Sync workspace
        run: devbox run setup
      - name: Validate release tag
        id: release
        run: >-
          devbox run -- uv run --locked python scripts/release.py "${GITHUB_REF_NAME}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Run checks
        run: devbox run check
      - name: Run tests
        run: devbox run test
      - name: Build package
        run: >-
          devbox run -- uv build --package "${{ steps.release.outputs.package }}"
          --out-dir dist --no-sources
      - name: Smoke-test distributions
        run: devbox run smoke-test -- --package "${{ steps.release.outputs.package }}"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.verify.outputs.package }} ${{ needs.verify.outputs.version }}
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish package
        run: uv publish --trusted-publishing always dist/*
