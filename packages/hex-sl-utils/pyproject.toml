[project]
name = "hex-sl-utils"
version = "0.1.0.dev0"
description = "Reusable models and utilities for Hex semantic-layer resources"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "eval-type-backport>=0.2.2; python_version < '3.10'",
  "pydantic>=2.10",
  "rapidyaml>=0.15.2,<0.16",
  "typing-extensions>=4.12",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
repository = "https://github.com/hex-inc/hex-sl-utils"

[tool.smoke-test]
python-versions = ["3.9", "3.14"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"
