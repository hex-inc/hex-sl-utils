id: products
base_sql_table: pizza_bytes.products
description: Dimensional table of product information.
dimensions:
  - id: id
    type: string
    visibility: internal
    unique: true
  - id: name
    type: string
  - id: pizza_size
    type: string
  - id: pizza_shape
    type: string
  - id: pizza_type
    type: string
  - id: price
    type: number
