[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "syrupy>=6.0.0",
    "inline-snapshot>=0.35.4",
    "rumdl>=0.2.60",
    "ty>=0.0.77",
]

[project]
name = "ossie-hex"
version = "0.2.0.dev0"
description = "Bidirectional converter between Apache Ossie semantic models and Hex semantic projects"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "Apache Ossie",
    "Ossie",
    "Hex",
]
dependencies = [
    "apache-ossie>=0.2.0.dev0",
    "hex-sl-utils>=0.2.0",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "PyYAML>=6.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
ossie-hex = "ossie_hex.cli:main"

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/hex-inc/hex-sl-utils/"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_hex"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename={filename} -"

[tool.ruff]
target-version = "py311"

[tool.rumdl]
flavor = "gfm"

[tool.rumdl.MD013]
reflow = true

[tool.rumdl.per-file-ignores]
# Preserve the upstream guide, including links into the Apache repository.
"**/CONTRIBUTING.md" = ["MD057"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

# Development sources; preview releases supply built wheels explicitly.
[tool.uv.sources]
apache-ossie = { git = "https://github.com/apache/ossie.git", rev = "b6c702ed1c07e91382a69e870c875cbd19570828", subdirectory = "python" }
hex-sl-utils = { workspace = true }

[tool.release]
publish = false

[tool.smoke-test]
python-versions = ["3.11", "3.14"]
