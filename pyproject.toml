[project]
name = "hex-sl-utils-workspace"
version = "0.0.0"
description = "Development workspace for Hex semantic-layer utility packages"
requires-python = ">=3.9"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "VENDORED_LICENSES"]

[dependency-groups]
dev = [
  "inline-snapshot>=0.31.1",
  "lark>=1.3.1,<2; python_version >= '3.14'",
  "libcst>=1.9.0,<2; python_version >= '3.14'",
  "packaging>=26.3",
  "pyright>=1.1.411",
  "pytest>=8.4.2",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
  "requests>=2.34.2,<3; python_version >= '3.14'",
  "ruff>=0.16.1",
  "rumdl>=0.2.52",
]

[tool.uv]
default-groups = ["dev"]
package = false
required-version = ">=0.12.1"

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["packages", "tests"]
markers = [
  "database: requires a database service or database-specific client",
  "integration: crosses a process or external-service boundary",
]

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]
source = ["packages"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

[tool.pyright]
include = ["packages", "scripts", "tests"]
exclude = ["**/_vendor", "**/calc/_calc_parser_standalone.py"]
ignore = ["packages/hex-sl-utils/tests/calc"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."
executionEnvironments = [
  { root = "packages/hex-sl-utils", pythonVersion = "3.9" },
  { root = "scripts", pythonVersion = "3.14" },
  { root = ".", pythonVersion = "3.14" },
]

[tool.ruff]
extend-exclude = ["**/_vendor", "**/calc/_calc_parser_standalone.py"]
line-length = 88
required-version = ">=0.16.1"
target-version = "py314"

[tool.ruff.per-file-target-version]
"packages/hex-sl-utils/**/*.py" = "py39"
"scripts/**/*.py" = "py314"

[tool.ruff.lint.isort]
known-first-party = ["hex_sl_utils"]

[tool.rumdl]
exclude = ["**/_vendor/**"]
flavor = "gfm"

[tool.rumdl.MD013]
reflow = true
