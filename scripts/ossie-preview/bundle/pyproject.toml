[project]
name = "apache-ossie-preview-bundle"
version = "0.0.0"
description = "Shared runtime dependency lock for the Apache Ossie preview converters"
requires-python = ">=3.12"
# Keep these as bare distribution names: the release builder uses this inventory.
dependencies = ["apache-ossie", "apache-ossie-dbt", "ossie-hex"]

[tool.uv]
package = false
required-version = ">=0.12.1"

# This release environment is separate from the repository's development workspace.
[tool.uv.workspace]
members = []

[tool.uv.sources]
apache-ossie = { path = "../../../external/apache-ossie-converters/ossie/python", editable = true }
apache-ossie-dbt = { path = "../../../external/apache-ossie-converters/dbt" }
ossie-hex = { path = "../../../external/apache-ossie-converters/hex" }
